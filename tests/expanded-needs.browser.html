<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Needs Expanded browser fixture</title>
    <style>
        :root {
            --ink: #ececec;
            --muted: #a7a7a7;
            --line: #505050;
            --ok: #55bd6a;
            --warn: #e0ad3d;
            --danger: #df5b5b;
            --need-icon-size: 20px;
            --moodle-size: 32px;
        }

        body {
            box-sizing: border-box;
            width: 720px;
            margin: 0;
            padding: 24px;
            background: #181818;
            color: var(--ink);
            font: 14px/1.3 system-ui, sans-serif;
        }

        #fixture {
            padding: 16px;
            border: 1px solid var(--line);
            background: #242424;
        }
    </style>
    <link rel="stylesheet" href="../42/media/web/expanded-needs.css">
</head>
<body>
    <main id="fixture"></main>
    <script>
        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }
        window.PZ_MOODLE_ICONS = {
            circle_good: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2355bd6a'/%3E%3C/svg%3E",
            circle_bad1: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23a16a62'/%3E%3C/svg%3E",
            circle_bad2: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23b65f58'/%3E%3C/svg%3E",
            circle_bad3: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23df5b5b'/%3E%3C/svg%3E",
            circle_bad4: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ef3535'/%3E%3C/svg%3E"
        };
    </script>
    <script src="../42/media/web/expanded-needs.js"></script>
    <script>
        // The production page supplies this vanilla glyph through PZ Pulse's
        // full icon map. Reuse an embedded fixture glyph here so the layout
        // exercise covers a vanilla badge without copying base-game art.
        const fixtureVanillaGlyph =
            PZ_PULSE_EXPANDED_MOODLE_ICONS["lifestyle/MindfulState"];
        [
            "status_hunger", "status_thirst", "mood_sleepy",
            "status_difficultybreathing", "mood_bored", "mood_stressed",
            "mood_panicked", "mood_sad", "mood_pained", "mood_nauseous",
            "status_wet", "mood_drunk", "mood_discomfort"
        ].forEach((key) => {
            window.PZ_MOODLE_ICONS[key] = fixtureVanillaGlyph;
        });

        const needs = [
            ["Hunger", 8, true, "status_hunger"],
            ["Thirst", 18, true, "status_thirst"],
            ["Fatigue", 30, true, "mood_sleepy"],
            ["Stamina", 35, false, "status_difficultybreathing"],
            ["Boredom", 42, true, "mood_bored"],
            ["Stress", 52, true, "mood_stressed"],
            ["Panic", 62, true, "mood_panicked"],
            ["Unhappiness", 70, true, "mood_sad"],
            ["Pain", 76, true, "mood_pained"],
            ["Sickness", 82, true, "mood_nauseous"],
            ["Wetness", 91, true, "status_wet"],
            ["Drunkenness", 100, true, "mood_drunk"]
        ].map(([label, value, badHigh, icon]) => ({ label, value, badHigh, icon }));

        document.getElementById("fixture").innerHTML = renderNeedsExpanded({
            needs,
            moodles: [
                { label: "Hungry", level: 2, valence: "bad", icon: "status_hunger" }
            ],
            needs_expanded: {
                discomfort: 27.42,
                natures_call: { bladder: 60, bowel: 0 },
                optional_mod_stats: {
                    lifestyle_hygiene_need: 67,
                    tasab_body_grime: 38,
                    bydt_dental_hygiene: 0.82
                },
                custom_moodles: [
                    {
                        id: "LifestyleHobbies:MindfulState",
                        label: "Mindful",
                        description: "Your mind is calm and focused.",
                        level: 2,
                        maxLevel: 4,
                        valence: "good",
                        iconKey: "lifestyle/MindfulState1",
                        source: { type: "mod", id: "LifestyleHobbies", name: "Lifestyle: Hobbies" }
                    },
                    {
                        id: "TakeABathAndShowerNew:BodyGrime",
                        label: "Body Grime",
                        description: "You should wash soon.",
                        level: 3,
                        maxLevel: 4,
                        valence: "bad",
                        iconKey: "tasab/BodyGrime",
                        source: { type: "mod", id: "TakeABathAndShowerNew", name: "Take A Bath And Shower" }
                    },
                    {
                        id: "DrugTime89:Stoned",
                        label: "Lightly Stoned",
                        description: "Relaxed and less stressed.",
                        level: 1,
                        maxLevel: 3,
                        valence: "good",
                        iconKey: "drugtime/DT_Stoned_1",
                        source: { type: "mod", id: "DrugTime89", name: "DrugTime 89" }
                    }
                ]
            }
        });
    </script>
</body>
</html>
